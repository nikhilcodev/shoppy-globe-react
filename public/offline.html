<!doctype html>
<html lang="en">
	<head>

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Offline</title>
		<style>
			body {
				margin: 0;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				background: #0f172a;
				color: #e2e8f0;

				justify-content: center;

				max-width: 400px;
			}
